name: Build & Deploy (Prod)

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Build the Docker image and push to GHCR
  # ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository owner to lowercase
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/${{ env.REPO_OWNER }}/hajji-backend:latest
          push: true

  # ──────────────────────────────────────────────
  # 2. SSH into the server and redeploy
  # ──────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set repository owner to lowercase
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create .env file from GitHub Secrets
        run: |
          echo "PORT=${{ secrets.PROD_PORT }}"                                                     >> .env
          echo "API_PREFIX=${{ secrets.PROD_API_PREFIX }}"                                         >> .env
          echo "NODE_ENV=production"                                                               >> .env
          echo "DATABASE_HOST=${{ secrets.PROD_DATABASE_HOST }}"                                   >> .env
          echo "DATABASE_PORT=${{ secrets.PROD_DATABASE_PORT }}"                                   >> .env
          echo "DATABASE_USER=${{ secrets.PROD_DATABASE_USER }}"                                   >> .env
          echo "DATABASE_PASSWORD=${{ secrets.PROD_DATABASE_PASSWORD }}"                           >> .env
          echo "DATABASE_NAME=${{ secrets.PROD_DATABASE_NAME }}"                                   >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.PROD_ACCESS_TOKEN_SECRET }}"                       >> .env
          echo "ACCESS_TOKEN_EXPIRES_IN=${{ secrets.PROD_ACCESS_TOKEN_EXPIRES_IN }}"               >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.PROD_REFRESH_TOKEN_SECRET }}"                     >> .env
          echo "REFRESH_TOKEN_EXPIRES_IN=${{ secrets.PROD_REFRESH_TOKEN_EXPIRES_IN }}"             >> .env
          echo "REFRESH_TOKEN_EXPIRES_IN_DAYS=${{ secrets.PROD_REFRESH_TOKEN_EXPIRES_IN_DAYS }}"   >> .env
          echo "OTP_EXPIRY_MINUTES=${{ secrets.PROD_OTP_EXPIRY_MINUTES }}"                         >> .env
          echo "SMS_LOCAL_AUTH=${{ secrets.PROD_SMS_LOCAL_AUTH }}"                                 >> .env
          echo "SMS_LOCAL_ORIGINATOR=${{ secrets.PROD_SMS_LOCAL_ORIGINATOR }}"                     >> .env
          echo "SMS_OSON_LOGIN=${{ secrets.PROD_SMS_OSON_LOGIN }}"                                 >> .env
          echo "SMS_OSON_SENDER=${{ secrets.PROD_SMS_OSON_SENDER }}"                               >> .env
          echo "SMS_OSON_HASH=${{ secrets.PROD_SMS_OSON_HASH }}"                                   >> .env
          echo "SMS_RU_AUTH=${{ secrets.PROD_SMS_RU_AUTH }}"                                       >> .env
          echo "SENDPULSE_CLIENT_ID=${{ secrets.PROD_SENDPULSE_CLIENT_ID }}"                       >> .env
          echo "SENDPULSE_CLIENT_SECRET=${{ secrets.PROD_SENDPULSE_CLIENT_SECRET }}"               >> .env
          echo "SENDPULSE_SENDER=${{ secrets.PROD_SENDPULSE_SENDER }}"                             >> .env
          echo "TELEGRAM_GATEWAY_TOKEN=${{ secrets.PROD_TELEGRAM_GATEWAY_TOKEN }}"                 >> .env
          echo "DEFAULT_COUNTRY_ID=${{ secrets.PROD_DEFAULT_COUNTRY_ID }}"                         >> .env

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Upload .env to server
        run: |
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            .env \
            ${{ secrets.SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/home/${{ secrets.SSH_USER }}/hajji.env

      - name: Cleanup private key
        run: rm -f private_key.pem

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo docker stop hajji-backend  || true
            sudo docker rm -f hajji-backend || true
            sudo docker rmi ghcr.io/${{ env.REPO_OWNER }}/hajji-backend:latest || true

            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/hajji-backend:latest

            sudo docker run \
              --env-file /home/${{ secrets.SSH_USER }}/hajji.env \
              --name hajji-backend \
              -p 3000:3000 \
              -d \
              --restart unless-stopped \
              ghcr.io/${{ env.REPO_OWNER }}/hajji-backend:latest
